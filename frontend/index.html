<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism Loop — Multi-Spectrum Equity Intelligence Workstation</title>
    <meta name="description" content="Prism Loop is an open-source, local-first equity research workstation with macroeconomic cycle scanning, 5-year SEC EDGAR & SEDAR+ text mining, and adversarial multi-agent debates." />
    <meta name="keywords" content="Prism Loop, equity research, value investing, SEC EDGAR text mining, macroeconomic cycle scanner, multi-agent stock debate, Margin of Safety, DCF fair value" />
    <meta property="og:title" content="Prism Loop — Multi-Spectrum Equity Intelligence Workstation" />
    <meta property="og:description" content="Adversarial AI stock debates, 5-year SEC 10-K text mining, and institutional Margin of Safety calculations in a single, local-first workstation." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('prism_loop_theme');
          var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 antialiased selection:bg-sky-500 selection:text-white dark:selection:text-slate-950 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
