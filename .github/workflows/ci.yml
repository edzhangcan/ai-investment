name: Continuous Integration (CI/CD Pipeline)

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: 🐍 Backend Pytest Suite & Linting
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall backend

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: "utf-8"
          LANG: "C.UTF-8"
          TESTING: "true"
        run: |
          set -o pipefail
          python -m pytest backend/tests/ -v -ra --tb=short 2>&1 | tee pytest_output.log

      - name: Report Pytest Failures in Summary and Commit Comment
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f pytest_output.log ]; then
            echo "## ❌ Pytest Test Suite Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            FAIL_LOG=$(tail -n 60 pytest_output.log)
            PAYLOAD=$(jq -n --arg body "### ❌ CI Pytest Suite Failure Log:
\`\`\`
$FAIL_LOG
\`\`\`" '{"body": $body}')
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" || true
          fi

  frontend-build:
    name: ⚛️ Frontend TypeScript Build & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Compiler & Vite Build
        working-directory: ./frontend
        run: npm run build

  docker-build-check:
    name: 🐳 Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Stack
        run: |
          docker compose build
