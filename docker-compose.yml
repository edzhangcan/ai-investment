services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_investment_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./backend/investment_platform.db:/app/backend/investment_platform.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/macro/dashboard"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_investment_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
